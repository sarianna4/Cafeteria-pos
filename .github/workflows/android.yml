
name: Construir APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Revisar archivos
        run: |
          find . -maxdepth 4 -type f | sort | head -200
          echo "Verificando configuracion de Gradle"
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

      - name: Compilar APK
        run: gradle assembleDebug --refresh-dependencies --stacktrace --info

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CafeteriaPOS-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
